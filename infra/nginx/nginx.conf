server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 30m;

    # SSE + long-running chat streams.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    chunked_transfer_encoding on;
    add_header X-Accel-Buffering no;

    location /api/ {
        proxy_pass http://api:4000;
    }

    # Internal session verification subrequest
    location = /_auth_verify {
        internal;
        proxy_pass http://api:4000/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # Public static assets
    location /assets/ {
        try_files $uri =404;
    }

    location = /verity-logo.png {
        try_files $uri =404;
    }

    location = /login-page-bg.jpg {
        try_files $uri =404;
    }

    location = /favicon.ico {
        try_files $uri =404;
    }

    # Public authentication route
    location /login {
        try_files $uri /index.html;
    }

    location /dev/ {
        try_files $uri /index.html;
    }

    # Protected pages require a valid session
    location / {
        auth_request /_auth_verify;
        error_page 401 = @login_redirect;
        try_files $uri $uri/ /index.html;
    }

    location @login_redirect {
        return 302 /login?redirect=$request_uri;
    }
}
