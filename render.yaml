# Render.com blueprint for Verity
services:
  # PostgreSQL 16 + pgvector
  - name: verity-postgres
    type: web
    env: docker
    region: oregon
    plan: free
    dockerfilePath: infra/postgres/Dockerfile
    envVars:
      - key: POSTGRES_DB
        value: verity
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        generateValue: true
      - key: VERITY_APP_USER
        value: verity_app
      - key: VERITY_APP_PASSWORD
        generateValue: true
      - key: SQL_RO_USER
        value: verity_sql_ro
      - key: SQL_RO_PASSWORD
        generateValue: true

  # Redis (caching, rate limiting)
  - name: verity-redis
    type: redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
    # CIDR blocks only. Empty list = internal connections only (verity-ai,
    # verity-api can connect over Render's private network).
    ipAllowList: []

  # AI service (FastAPI — RAG, embeddings, SQL generation)
  - name: verity-ai
    type: web
    env: docker
    region: oregon
    plan: free
    dockerfilePath: services/ai/Dockerfile
    envVars:
      - key: POSTGRES_HOST
        fromService:
          name: verity-postgres
          type: web
          property: host
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_DB
        value: verity
      - key: POSTGRES_SUPERUSER
        value: postgres
      - key: POSTGRES_PASSWORD
        fromService:
          name: verity-postgres
          type: web
          envVarKey: POSTGRES_PASSWORD
      - key: VERITY_APP_USER
        fromService:
          name: verity-postgres
          type: web
          envVarKey: VERITY_APP_USER
      - key: VERITY_APP_PASSWORD
        fromService:
          name: verity-postgres
          type: web
          envVarKey: VERITY_APP_PASSWORD
      - key: SQL_RO_USER
        fromService:
          name: verity-postgres
          type: web
          envVarKey: SQL_RO_USER
      - key: SQL_RO_PASSWORD
        fromService:
          name: verity-postgres
          type: web
          envVarKey: SQL_RO_PASSWORD
      - key: REDIS_URL
        fromService:
          name: verity-redis
          type: redis
          property: connectionString
      - key: LLM_PROVIDER
        value: google
      - key: LLM_MODEL
        value: gemini-3.6-flash
      - key: EMBEDDING_PROVIDER
        value: google
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIM
        value: "768"
      - key: RERANKER
        value: none
      - key: GOOGLE_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: info
    healthCheckPath: /health

  # API gateway (Express/Node.js)
  - name: verity-api
    type: web
    env: docker
    region: oregon
    plan: free
    dockerfilePath: apps/api/Dockerfile
    envVars:
      - key: POSTGRES_HOST
        fromService:
          name: verity-postgres
          type: web
          property: host
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_DB
        value: verity
      - key: POSTGRES_SUPERUSER
        value: postgres
      - key: POSTGRES_PASSWORD
        fromService:
          name: verity-postgres
          type: web
          envVarKey: POSTGRES_PASSWORD
      - key: VERITY_APP_USER
        fromService:
          name: verity-postgres
          type: web
          envVarKey: VERITY_APP_USER
      - key: VERITY_APP_PASSWORD
        fromService:
          name: verity-postgres
          type: web
          envVarKey: VERITY_APP_PASSWORD
      - key: REDIS_URL
        fromService:
          name: verity-redis
          type: redis
          property: connectionString
      # Calls verity-ai over Render's private network (service name resolves
      # internally; FastAPI listens on port 8000 per its Dockerfile).
      - key: AI_SERVICE_URL
        value: http://verity-ai:8000
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true
      # Public URL of the web frontend (used for CORS origin checks).
      # Render's default subdomain for the "verity-web" service. If Render
      # appends a hash suffix on first deploy, update this value to match
      # the actual subdomain shown in the dashboard.
      - key: WEB_ORIGIN
        value: https://verity-web.onrender.com
      - key: NODE_ENV
        value: production
    healthCheckPath: /health

  # Web frontend (React + Vite, served by nginx)
  - name: verity-web
    type: web
    env: docker
    region: oregon
    plan: free
    dockerfilePath: apps/web/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      # Public URL of the API, baked into the frontend at build time.
      # Render's default subdomain for the "verity-api" service. If Render
      # appends a hash suffix on first deploy, update this value to match
      # the actual subdomain shown in the dashboard.
      - key: VITE_API_URL
        value: https://verity-api.onrender.com
    healthCheckPath: /
