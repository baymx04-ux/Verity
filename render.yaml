# Render.com blueprint for Verity — free-tier topology.
#
#   browser -> verity-web (nginx)  --https-->  verity-api (Node)  --https-->  verity-ai (FastAPI)
#                                                    |                          |
#                                                    +---- Render Key Value ----+
#                                                    +---- external Postgres ---+
#
# Why this shape (see DEPLOY.md for the full reasoning):
#
#   * Free web services cannot RECEIVE private-network traffic. They can SEND
#     it. So verity-web -> verity-api and verity-api -> verity-ai have to use
#     each service's public https:// URL, while Render Key Value (a datastore)
#     stays on the private network.
#   * Free web services have an ephemeral filesystem and cannot attach a
#     persistent disk, so Postgres must live outside this blueprint. Any managed
#     Postgres with pgvector works (Neon and Supabase both have free tiers).
#   * Free web services spin down after 15 minutes without traffic; the first
#     request after that takes about a minute to wake the service.
#
# Service-to-service URLs are wired from each service's RENDER_EXTERNAL_HOSTNAME
# rather than hardcoded "verity-*.onrender.com", so the deployment keeps working
# when Render appends a suffix to a taken subdomain. The nginx entrypoint and
# the API config add the https:// scheme.

envVarGroups:
  # Values shared by verity-api and verity-ai. Enter these once in the Render
  # dashboard ("Environment Groups"); the ones marked sync: false are prompted
  # for on first sync.
  - name: verity-shared
    envVars:
      # Full Postgres connection URLs for the two least-privilege roles, as
      # created by infra/postgres/bootstrap-external.sh. Use the DIRECT host
      # (drop "-pooler"): psycopg uses prepared statements, which PgBouncer
      # transaction pooling does not reliably support.
      #
      #   postgresql://verity_app:<password>@<host>/<db>?sslmode=require
      #   postgresql://verity_sql_ro:<password>@<host>/<db>?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: SQL_DATABASE_URL
        sync: false
      # HMAC secret for gateway -> AI calls. It must be IDENTICAL in both
      # services, so it lives here instead of being generated per service.
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true

services:
  # Redis (caching, rate limiting, ingestion queue)
  - name: verity-redis
    type: keyvalue
    region: oregon
    plan: free
    # Internal connections only; free web services can still reach it over the
    # private network because they are allowed to *send* private traffic.
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  # AI service (FastAPI — RAG, embeddings, SQL generation)
  - name: verity-ai
    type: web
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: services/ai/Dockerfile
    envVars:
      - fromGroup: verity-shared
      - key: REDIS_URL
        fromService:
          name: verity-redis
          type: keyvalue
          property: connectionString
      - key: LLM_PROVIDER
        value: google
      - key: LLM_MODEL
        value: gemini-3.6-flash
      - key: EMBEDDING_PROVIDER
        value: google
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIM
        value: '768'
      - key: RERANKER
        value: none
      - key: GOOGLE_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: info
    healthCheckPath: /health

  # API gateway (Express/Node.js)
  - name: verity-api
    type: web
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: apps/api/Dockerfile
    envVars:
      - fromGroup: verity-shared
      - key: REDIS_URL
        fromService:
          name: verity-redis
          type: keyvalue
          property: connectionString
      # Public URL of verity-ai. Free instances cannot receive private traffic,
      # so the gateway calls the AI service over the public internet. Render
      # substitutes the service's real hostname (with any suffix); the API
      # config adds the https:// scheme.
      - key: AI_SERVICE_URL
        fromService:
          name: verity-ai
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Public URL of the web frontend, used for CORS origin checks. Taken from
      # verity-web's real hostname so a suffixed subdomain still matches.
      - key: WEB_ORIGIN
        fromService:
          name: verity-web
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: COOKIE_SECURE
        value: 'true'
      - key: NODE_ENV
        value: production
    # The health route is /api/health; /health 404s and fails the check.
    healthCheckPath: /api/health

  # Web frontend (React + Vite, served by nginx)
  - name: verity-web
    type: web
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: apps/web/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      # nginx resolves this at request time, so a cold/slow API cannot stop the
      # frontend container from starting. Must be the PUBLIC hostname: free
      # instances cannot receive private-network traffic. Render substitutes the
      # API's real hostname (with any suffix); the container entrypoint adds the
      # https:// scheme.
      - key: API_UPSTREAM
        fromService:
          name: verity-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      # Public DNS, because no private-network names are used here.
      - key: DNS_RESOLVER
        value: 1.1.1.1
    # Static liveness route that does not depend on the API being reachable.
    healthCheckPath: /healthz
